title: AWS DevOps Utility Documentation
description: A collection of useful AWS DevOps utilities and guides
theme: jekyll-theme-minimal

# GitHub Pages settings
baseurl: "" # if your site is at username.github.io/repo-name, then set this to "/repo-name"
url: "" # Your GitHub Pages URL

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Markdown Processing
highlighter: rouge

# Include files & folders that might be ignored
include:
  - _includes
  - _layouts
  - assets

# Defaults for front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "*.md"
    values:
      layout: "default"

# Plugins
plugins:
  - jekyll-seo-tag
